services:
  nextjs-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/nextjsdb
      NODE_ENV: production
      JWT_SECRET: "YOUR_SUPER_SECRET_KEY_HERE"
    networks:
      - nextjs-network
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - nextjs-network
    restart: always

volumes:
  mongo-data:

networks:
  nextjs-network:
    driver: bridge
